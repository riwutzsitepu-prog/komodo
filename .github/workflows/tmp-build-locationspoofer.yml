name: Build LocationSpoofer NO-GMS OSM Map V5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-build-locationspoofer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APK_NAME: LocationSpoofer_v1.11.7_NO_API_SEARCH_OSM_MAP_V5.apk
      STATUS_FILE: LOCATIONSPOOFER_V5_STATUS.txt
    steps:
      - uses: actions/checkout@v4

      - name: Mark started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(printf 'STATUS=STARTED\nRUN_ID=%s\n' "$GITHUB_RUN_ID")
          ENC=$(printf '%s' "$BODY" | base64 -w0)
          OLD=$(gh api "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$OLD" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE" -f message="LocationSpoofer V5 STARTED" -f content="$ENC" -f sha="$OLD" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE" -f message="LocationSpoofer V5 STARTED" -f content="$ENC" -f branch=main >/dev/null
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Clone LocationSpoofer v1.11.7
        run: git clone --depth 1 --branch v1.11.7 https://github.com/HuangZhuoRui/LocationSpoofer.git locationspoofer

      - name: Patch Search, startup and map renderer
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # 1) Search -> OpenStreetMap Nominatim
          src = Path('locationspoofer/app/src/main/java/com/suseoaa/locationspoofer/ui/screen/SpoofingScreen.kt')
          text = src.read_text(encoding='utf-8')
          marker = 'private var cachedPlacesClient:'
          if marker not in text:
              raise SystemExit('performPoiSearch marker not found')
          start = text.index(marker)
          replacement = r'''fun performPoiSearch(
              context: android.content.Context,
              keyword: String,
              isDomestic: Boolean,
              onResult: (List<AppPoiItem>) -> Unit
          ) {
              if (keyword.isBlank()) { onResult(emptyList()); return }
              kotlinx.coroutines.GlobalScope.launch(kotlinx.coroutines.Dispatchers.IO) {
                  try {
                      val encoded = java.net.URLEncoder.encode(keyword.trim(), "UTF-8")
                      val url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=10&addressdetails=1&accept-language=id,en&q=$encoded"
                      val client = okhttp3.OkHttpClient.Builder()
                          .connectTimeout(10, java.util.concurrent.TimeUnit.SECONDS)
                          .readTimeout(15, java.util.concurrent.TimeUnit.SECONDS)
                          .callTimeout(20, java.util.concurrent.TimeUnit.SECONDS)
                          .build()
                      val request = okhttp3.Request.Builder()
                          .url(url)
                          .header("User-Agent", "LocationSpoofer/1.11.7 (Android; OSM-MAP-NO-API)")
                          .header("Accept", "application/json")
                          .build()
                      val results = mutableListOf<AppPoiItem>()
                      client.newCall(request).execute().use { response ->
                          if (!response.isSuccessful) throw java.io.IOException("HTTP ${response.code}")
                          val array = org.json.JSONArray(response.body?.string().orEmpty())
                          for (i in 0 until array.length()) {
                              val obj = array.optJSONObject(i) ?: continue
                              val lat = obj.optString("lat").toDoubleOrNull() ?: continue
                              val lng = obj.optString("lon").toDoubleOrNull() ?: continue
                              val displayName = obj.optString("display_name", "")
                              val osmName = obj.optString("name", "")
                              val title = if (osmName.isNotBlank()) osmName else displayName.substringBefore(',').ifBlank { keyword }
                              results.add(AppPoiItem(title, displayName, lat, lng))
                          }
                      }
                      kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.Main) {
                          if (results.isEmpty()) android.widget.Toast.makeText(context, "No search results for: $keyword", android.widget.Toast.LENGTH_SHORT).show()
                          onResult(results)
                      }
                  } catch (e: Exception) {
                      kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.Main) {
                          android.widget.Toast.makeText(context, "Search Error: ${e.message}", android.widget.Toast.LENGTH_LONG).show()
                          onResult(emptyList())
                      }
                  }
              }
          }
          '''
          src.write_text(text[:start] + replacement + '\n', encoding='utf-8')

          # 2) Do not initialize Google Places at application startup
          app = Path('locationspoofer/app/src/main/java/com/suseoaa/locationspoofer/LocationApp.kt')
          a = app.read_text(encoding='utf-8')
          old = '''        if (!Places.isInitialized()) {
            Places.initialize(this, BuildConfig.GOOGLE_MAPS_API_KEY)
        }
'''
          if old not in a:
              raise SystemExit('Places startup block not found')
          a = a.replace(old, '''        // NO-API build: Google Places is intentionally not initialized.\n''', 1)
          app.write_text(a, encoding='utf-8')

          # 3) Replace Google/AMap map renderer with native OpenStreetMap (osmdroid)
          mapfile = Path('locationspoofer/app/src/main/java/com/suseoaa/locationspoofer/ui/components/AppMapView.kt')
          mapfile.write_text(r'''package com.suseoaa.locationspoofer.ui.components

import android.os.Handler
import android.os.Looper
import androidx.compose.runtime.Composable
import androidx.compose.runtime.DisposableEffect
import androidx.compose.runtime.remember
import androidx.compose.ui.Modifier
import androidx.compose.ui.platform.LocalContext
import androidx.compose.ui.platform.LocalLifecycleOwner
import androidx.compose.ui.viewinterop.AndroidView
import androidx.lifecycle.Lifecycle
import androidx.lifecycle.LifecycleEventObserver
import org.osmdroid.config.Configuration
import org.osmdroid.events.MapListener
import org.osmdroid.events.ScrollEvent
import org.osmdroid.events.ZoomEvent
import org.osmdroid.tileprovider.tilesource.TileSourceFactory
import org.osmdroid.util.GeoPoint
import org.osmdroid.views.CustomZoomButtonsController
import org.osmdroid.views.MapView
import org.osmdroid.views.overlay.Marker
import org.osmdroid.views.overlay.Polyline

interface AppMapMarker {
    fun setPosition(lat: Double, lng: Double)
}

enum class MarkerType { GREEN, RED, ORANGE, DEFAULT }

interface AppMapController {
    fun clear()
    fun addPolyline(points: List<Pair<Double, Double>>, colorInt: Int, width: Float)
    fun addMarker(lat: Double, lng: Double, title: String, type: MarkerType): AppMapMarker
    fun animateCamera(lat: Double, lng: Double, zoom: Float? = null)
    fun moveCamera(lat: Double, lng: Double, zoom: Float? = null)
    val cameraTargetLat: Double?
    val cameraTargetLng: Double?
    fun setOnCameraChangeListener(onFinish: (lat: Double, lng: Double) -> Unit)
    fun disableUiControls()
}

class OSMMapControllerImpl(private val map: MapView) : AppMapController {
    override fun clear() {
        map.overlays.clear()
        map.invalidate()
    }

    override fun addPolyline(points: List<Pair<Double, Double>>, colorInt: Int, width: Float) {
        val line = Polyline().apply {
            setPoints(points.map { GeoPoint(it.first, it.second) })
            outlinePaint.color = colorInt
            outlinePaint.strokeWidth = width
        }
        map.overlays.add(line)
        map.invalidate()
    }

    override fun addMarker(lat: Double, lng: Double, title: String, type: MarkerType): AppMapMarker {
        val marker = Marker(map).apply {
            position = GeoPoint(lat, lng)
            this.title = title
            setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
        }
        map.overlays.add(marker)
        map.invalidate()
        return object : AppMapMarker {
            override fun setPosition(lat: Double, lng: Double) {
                marker.position = GeoPoint(lat, lng)
                map.invalidate()
            }
        }
    }

    override fun animateCamera(lat: Double, lng: Double, zoom: Float?) {
        if (zoom != null) map.controller.setZoom(zoom.toDouble())
        map.controller.animateTo(GeoPoint(lat, lng))
    }

    override fun moveCamera(lat: Double, lng: Double, zoom: Float?) {
        if (zoom != null) map.controller.setZoom(zoom.toDouble())
        map.controller.setCenter(GeoPoint(lat, lng))
    }

    override val cameraTargetLat: Double?
        get() = map.mapCenter?.latitude

    override val cameraTargetLng: Double?
        get() = map.mapCenter?.longitude

    override fun setOnCameraChangeListener(onFinish: (lat: Double, lng: Double) -> Unit) {
        val handler = Handler(Looper.getMainLooper())
        var pending: Runnable? = null
        fun schedule() {
            pending?.let { handler.removeCallbacks(it) }
            val task = Runnable {
                val p = map.mapCenter
                onFinish(p.latitude, p.longitude)
            }
            pending = task
            handler.postDelayed(task, 220L)
        }
        map.addMapListener(object : MapListener {
            override fun onScroll(event: ScrollEvent?): Boolean {
                schedule()
                return true
            }
            override fun onZoom(event: ZoomEvent?): Boolean {
                schedule()
                return true
            }
        })
    }

    override fun disableUiControls() {
        map.zoomController.setVisibility(CustomZoomButtonsController.Visibility.NEVER)
        map.setMultiTouchControls(true)
        map.setBuiltInZoomControls(false)
    }
}

@Composable
fun AppMapView(
    isDomestic: Boolean,
    modifier: Modifier = Modifier,
    onMapReady: (AppMapController) -> Unit
) {
    val context = LocalContext.current
    val lifecycle = LocalLifecycleOwner.current.lifecycle

    val mapView = remember {
        Configuration.getInstance().userAgentValue = context.packageName
        MapView(context).apply {
            setTileSource(TileSourceFactory.MAPNIK)
            setMultiTouchControls(true)
            setTilesScaledToDpi(true)
            minZoomLevel = 3.0
            maxZoomLevel = 20.0
            zoomController.setVisibility(CustomZoomButtonsController.Visibility.NEVER)
        }
    }

    DisposableEffect(lifecycle, mapView) {
        val observer = LifecycleEventObserver { _, event ->
            when (event) {
                Lifecycle.Event.ON_RESUME -> mapView.onResume()
                Lifecycle.Event.ON_PAUSE -> mapView.onPause()
                Lifecycle.Event.ON_DESTROY -> mapView.onDetach()
                else -> Unit
            }
        }
        lifecycle.addObserver(observer)
        if (lifecycle.currentState.isAtLeast(Lifecycle.State.RESUMED)) mapView.onResume()
        onDispose {
            lifecycle.removeObserver(observer)
            mapView.onPause()
            mapView.onDetach()
        }
    }

    AndroidView(
        factory = {
            mapView.apply {
                setOnTouchListener { v, _ ->
                    v.parent?.requestDisallowInterceptTouchEvent(true)
                    false
                }
                post { onMapReady(OSMMapControllerImpl(this)) }
            }
        },
        modifier = modifier
    )
}
''', encoding='utf-8')

          # 4) Add osmdroid dependency and use normal debug signing for CI build.
          gradle = Path('locationspoofer/app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          dep_anchor = '    implementation(libs.okhttp)\n'
          if 'org.osmdroid:osmdroid-android' not in g:
              if dep_anchor not in g:
                  raise SystemExit('dependency anchor not found')
              g = g.replace(dep_anchor, dep_anchor + '    implementation("org.osmdroid:osmdroid-android:6.1.20")\n', 1)
          oldg = 'debug {\n            signingConfig = signingConfigs.getByName("release")'
          newg = 'debug {\n            signingConfig = signingConfigs.getByName("debug")'
          if oldg in g:
              g = g.replace(oldg, newg, 1)
          gradle.write_text(g, encoding='utf-8')
          PY

      - name: Build APK
        working-directory: locationspoofer
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Prepare output
        run: |
          cp locationspoofer/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          sha256sum "$APK_NAME" > "${APK_NAME}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer-v1.11.7-NO-API-SEARCH-OSM-MAP-V5
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          retention-days: 7

      - name: Mark done
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(sha256sum "$APK_NAME" | awk '{print $1}')
          BODY=$(printf 'STATUS=DONE\nRUN_ID=%s\nSHA256=%s\n' "$GITHUB_RUN_ID" "$SHA")
          ENC=$(printf '%s' "$BODY" | base64 -w0)
          OLD=$(gh api "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$OLD" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE" -f message="LocationSpoofer V5 DONE" -f content="$ENC" -f sha="$OLD" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE" -f message="LocationSpoofer V5 DONE" -f content="$ENC" -f branch=main >/dev/null
          fi

      - name: Mark failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(printf 'STATUS=FAILED\nRUN_ID=%s\n' "$GITHUB_RUN_ID")
          ENC=$(printf '%s' "$BODY" | base64 -w0)
          OLD=$(gh api "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$OLD" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE" -f message="LocationSpoofer V5 FAILED" -f content="$ENC" -f sha="$OLD" -f branch=main >/dev/null || true
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$STATUS_FILE" -f message="LocationSpoofer V5 FAILED" -f content="$ENC" -f branch=main >/dev/null || true
          fi